name: Publish to GitHub Packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write
  id-token: write # Required for generating build provenance and cryptographic attestation
  attestations: write

jobs:
  publish:
    name: Build, Attest & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Amazon Corretto 25
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '25'
          cache: 'maven'

      - name: Build & Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          echo "Publishing release version ${RELEASE_VERSION}"
          mvn --batch-mode clean deploy \
            -Prelease \
            -Drevision="${RELEASE_VERSION}" \
            -DskipTests \
            -DaltDeploymentRepository=github::https://maven.pkg.github.com/${{ github.repository }}

      - name: Generate Artifact Attestation (Provenance)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: '**/target/*.jar'
